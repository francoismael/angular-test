<h2>Users</h2>
<table class="classic-table">
  <thead>
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Email</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let user of user">
      <td>{{ user.code }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
    </tr>
  </tbody>
</table>
